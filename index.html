<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班級經營小幫手 - 雲端進階版</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="班小幫手">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1080/1080985.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast-enter { animation: toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toastEnter {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .action-bar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-bar-hidden { transform: translateY(150%); }
        .action-bar-visible { transform: translateY(0); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex-shrink-0 flex justify-between items-center relative">
        <h1 class="text-xl font-bold tracking-wider">班級經營小幫手</h1>
        <div id="auth-status" class="text-xs bg-blue-700 px-3 py-1.5 rounded-full text-blue-100 flex items-center gap-2 shadow-inner">
            <i class="fas fa-spinner fa-spin"></i> 連線中
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto relative custom-scrollbar pb-32 p-4">
        <div id="loading-spinner" class="flex flex-col items-center justify-center h-full text-gray-400 gap-3">
            <i class="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i>
            <p>載入雲端資料中...</p>
        </div>
    </main>

    <!-- Floating Action Bar -->
    <div id="action-bar" class="fixed bottom-16 left-0 w-full p-4 z-30 action-bar action-bar-hidden pointer-events-none">
        <div class="bg-gray-900 text-white rounded-2xl shadow-2xl p-4 flex flex-col gap-3 pointer-events-auto border border-gray-700">
            <div class="flex justify-between items-center">
                <div class="flex-1">
                    <div class="text-xs text-gray-400 mb-1" id="action-subject">日常常規</div>
                    <div class="font-bold text-lg" id="action-desc">準備紀錄...</div>
                </div>
                <div class="flex items-center gap-3 bg-gray-800 rounded-xl p-1 border border-gray-700">
                    <button id="btn-dec-count" class="w-8 h-8 rounded-lg bg-gray-700 text-white hover:bg-gray-600 flex items-center justify-center font-bold active:scale-95 transition-transform">-</button>
                    <span id="action-count" class="font-bold text-lg w-6 text-center">1</span>
                    <button id="btn-inc-count" class="w-8 h-8 rounded-lg bg-gray-700 text-white hover:bg-gray-600 flex items-center justify-center font-bold active:scale-95 transition-transform">+</button>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="btn-clear-selection" class="px-4 py-2 bg-gray-700 text-white rounded-xl font-medium hover:bg-gray-600 active:scale-95 transition-transform">取消</button>
                <button id="btn-submit-record" class="flex-1 px-4 py-2 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 active:scale-95 transition-transform shadow-[0_0_15px_rgba(59,130,246,0.5)] flex justify-center items-center gap-2">
                    <i class="fas fa-paper-plane"></i> 確認送出
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-safe">
        <div class="flex justify-around items-center h-16">
            <button data-tab="record" class="nav-btn flex flex-col items-center justify-center w-full h-full text-blue-600 transition-colors">
                <i class="fas fa-clipboard-check text-xl mb-1"></i>
                <span class="text-xs font-medium">評分</span>
            </button>
            <button data-tab="manage" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 transition-colors hover:text-blue-500">
                <i class="fas fa-list-check text-xl mb-1"></i>
                <span class="text-xs font-medium">項目</span>
            </button>
            <button data-tab="stats" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 transition-colors hover:text-blue-500">
                <i class="fas fa-chart-pie text-xl mb-1"></i>
                <span class="text-xs font-medium">統計</span>
            </button>
            <button data-tab="settings" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 transition-colors hover:text-blue-500">
                <i class="fas fa-cog text-xl mb-1"></i>
                <span class="text-xs font-medium">設定</span>
            </button>
        </div>
    </nav>

    <!-- UI Overlays -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-11/12 max-w-sm"></div>
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex-items-center justify-center p-4"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'classroom-manager-pro';
        
        // 這裡已經換成你專屬的 Firebase 金鑰！
        const firebaseConfig = {
            apiKey: "AIzaSyDHgLHHGsaq1tKFplX65_vK1kHz369s_ho",
            authDomain: "classroom-db-63b1a.firebaseapp.com",
            projectId: "classroom-db-63b1a",
            storageBucket: "classroom-db-63b1a.firebasestorage.app",
            messagingSenderId: "1015916849173",
            appId: "1:1015916849173:web:23ba3dbf221e3d0061861c"
        };

        let app, db, auth, currentUser;
        
        // Date helper format YYYY-MM-DD local
        function getLocalDateString(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        const todayStr = getLocalDateString(new Date());

        const state = {
            currentTab: 'record',
            isLoaded: false,
            selectedStudents: new Set(),
            selectedBehaviorId: null,
            actionCount: 1,
            // 雲端設定狀態
            settings: {
                studentsCount: 30,
                groups: [], 
                subjects: ['日常常規', '國語', '數學', '英文', '社會', '自然'],
                currentSubject: '日常常規'
            },
            // 統計篩選器狀態
            statFilters: {
                subject: 'all',
                dateType: 'today',
                startDate: todayStr,
                endDate: todayStr
            },
            behaviors: [],
            records: [],
            currentFilteredRecords: []
        };

        const defaultBehaviors = [
            { name: '上課發言', points: 1, type: 'positive' },
            { name: '作業優良', points: 2, type: 'positive' },
            { name: '熱心助人', points: 2, type: 'positive' },
            { name: '遲到', points: -1, type: 'negative' },
            { name: '上課吵鬧', points: -1, type: 'negative' },
            { name: '未交作業', points: -2, type: 'negative' }
        ];

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // 使用匿名登入
                await signInAnonymously(auth);
                
                currentUser = auth.currentUser;
                document.getElementById('auth-status').innerHTML = '<i class="fas fa-cloud text-green-300"></i> 已連線';
                
                setupCloudSync();
            } catch (error) {
                console.error("Firebase init error:", error);
                document.getElementById('auth-status').innerHTML = '<i class="fas fa-wifi text-red-300"></i> 連線失敗';
                showToast("雲端連線失敗，請重新整理頁面", "error");
            }
        }

        function setupCloudSync() {
            if (!currentUser) return;
            const uid = currentUser.uid;
            
            // 1. 同步設定與小組
            const settingsRef = doc(db, 'artifacts', appId, 'users', uid, 'config', 'settings');
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.settings = { ...state.settings, ...data };
                    
                    // 產生預設小組 (如果尚未設定)
                    if (!state.settings.groups || state.settings.groups.length === 0) {
                        const groups = [];
                        const groupSize = data.groupSize || 5; 
                        const numGroups = Math.ceil(state.settings.studentsCount / groupSize);
                        for(let i=0; i<numGroups; i++) {
                            const members = [];
                            for(let j=1; j<=groupSize; j++) {
                                const sid = i*groupSize + j;
                                if(sid <= state.settings.studentsCount) members.push(sid);
                            }
                            groups.push({ id: `g${Date.now()}_${i}`, name: `第${i+1}組`, members });
                        }
                        state.settings.groups = groups;
                        setDoc(settingsRef, state.settings, {merge: true});
                    }
                } else {
                    setDoc(settingsRef, state.settings);
                }
                checkAllLoaded();
            }, (err) => console.error(err));

            // 2. 同步行為項目
            const behaviorsRef = collection(db, 'artifacts', appId, 'users', uid, 'behaviors');
            onSnapshot(behaviorsRef, (snapshot) => {
                state.behaviors = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (snapshot.empty && !state.behaviorsInitialized) {
                    state.behaviorsInitialized = true;
                    defaultBehaviors.forEach(b => {
                        addDoc(collection(db, 'artifacts', appId, 'users', uid, 'behaviors'), b);
                    });
                }
                checkAllLoaded();
            }, (err) => console.error(err));

            // 3. 同步紀錄
            const recordsRef = collection(db, 'artifacts', appId, 'users', uid, 'records');
            onSnapshot(recordsRef, (snapshot) => {
                state.records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                state.records.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                checkAllLoaded();
            }, (err) => console.error(err));
        }

        let loadChecks = 0;
        function checkAllLoaded() {
            loadChecks++;
            if (loadChecks >= 3 && !state.isLoaded) {
                state.isLoaded = true;
                renderApp();
            } else if (state.isLoaded) {
                renderApp(); 
            }
        }

        function renderApp() {
            const content = document.getElementById('app-content');
            content.innerHTML = '';
            
            switch(state.currentTab) {
                case 'record': content.appendChild(createRecordView()); break;
                case 'manage': content.appendChild(createManageView()); break;
                case 'stats': content.appendChild(createStatsView()); break;
                case 'settings': content.appendChild(createSettingsView()); break;
            }
            updateActionBar();
        }

        function createRecordView() {
            const container = document.createElement('div');
            container.className = 'fade-in flex flex-col gap-5';

            // 1. 科目選擇
            const subjectDiv = document.createElement('div');
            subjectDiv.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between sticky top-0 z-10';
            const selectOptions = state.settings.subjects.map(s => 
                `<option value="${s}" ${state.settings.currentSubject === s ? 'selected' : ''}>${s}</option>`
            ).join('');
            subjectDiv.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas fa-book-open text-blue-500"></i>
                    <span class="font-bold text-gray-700">當前紀錄：</span>
                </div>
                <select id="subject-selector" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                    ${selectOptions}
                </select>
            `;
            container.appendChild(subjectDiv);

            // 2. 項目選擇
            const behaviorsSection = document.createElement('div');
            behaviorsSection.innerHTML = `<div class="flex justify-between items-end mb-3 ml-1"><h2 class="text-sm font-bold text-gray-500">1. 選擇表現項目</h2><span class="text-xs text-gray-400">可先選項目或先選學生</span></div>`;
            const behaviorsGrid = document.createElement('div');
            behaviorsGrid.className = 'grid grid-cols-3 gap-2';

            state.behaviors.forEach(b => {
                const isPositive = b.type === 'positive';
                const isSelected = state.selectedBehaviorId === b.id;
                const btn = document.createElement('button');
                
                let baseClasses = `p-2 rounded-xl flex flex-col items-center justify-center border transition-all duration-200 relative `;
                if (isSelected) {
                    baseClasses += `bg-blue-600 border-blue-700 text-white shadow-md transform scale-105 ring-2 ring-blue-300 ring-offset-1`;
                } else {
                    baseClasses += isPositive ? 'bg-green-50 border-green-100 text-green-700 hover:bg-green-100' : 'bg-red-50 border-red-100 text-red-700 hover:bg-red-100';
                }

                btn.className = baseClasses;
                btn.innerHTML = `
                    <span class="font-bold text-sm mb-1 line-clamp-1">${b.name}</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${isSelected ? 'bg-white/20' : (isPositive ? 'bg-green-100' : 'bg-red-100')}">${isPositive ? '+' : ''}${b.points}</span>
                    ${isSelected ? '<div class="absolute -top-1 -right-1 w-4 h-4 bg-blue-500 rounded-full border-2 border-white"></div>' : ''}
                `;
                btn.onclick = () => toggleBehavior(b.id);
                behaviorsGrid.appendChild(btn);
            });
            behaviorsSection.appendChild(behaviorsGrid);
            container.appendChild(behaviorsSection);

            // 3. 學生選擇
            const studentsSection = document.createElement('div');
            studentsSection.innerHTML = `
                <div class="flex justify-between items-end mb-3 ml-1 mt-2">
                    <h2 class="text-sm font-bold text-gray-500">2. 選擇學生 (已選 ${state.selectedStudents.size} 人)</h2>
                </div>
            `;
            
            // 自訂小組捷徑
            const groupScroll = document.createElement('div');
            groupScroll.className = 'flex gap-2 overflow-x-auto no-scrollbar mb-3 pb-1';
            
            (state.settings.groups || []).forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'whitespace-nowrap px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs font-bold hover:bg-gray-200 border border-gray-200 active:scale-95 transition-transform';
                btn.innerText = g.name;
                btn.onclick = () => toggleCustomGroupSelection(g.members);
                groupScroll.appendChild(btn);
            });
            studentsSection.appendChild(groupScroll);

            // 學生網格
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-5 sm:grid-cols-6 gap-2';
            for (let i = 1; i <= state.settings.studentsCount; i++) {
                const isSelected = state.selectedStudents.has(i);
                const btn = document.createElement('button');
                btn.className = `aspect-square rounded-xl font-bold text-lg flex items-center justify-center transition-all duration-200 ${isSelected ? 'bg-blue-600 text-white shadow-md transform scale-105 ring-2 ring-blue-300 ring-offset-1' : 'bg-white text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50'}`;
                btn.innerText = i;
                btn.onclick = () => toggleStudent(i);
                grid.appendChild(btn);
            }
            studentsSection.appendChild(grid);
            container.appendChild(studentsSection);

            setTimeout(() => {
                const sel = document.getElementById('subject-selector');
                if(sel) {
                    sel.onchange = async (e) => {
                        const newSubject = e.target.value;
                        state.settings.currentSubject = newSubject;
                        if(currentUser) {
                            const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'config', 'settings');
                            await updateDoc(ref, { currentSubject: newSubject });
                        }
                    };
                }
            }, 0);

            return container;
        }

        window.toggleBehavior = function(id) {
            if (state.selectedBehaviorId === id) state.selectedBehaviorId = null; 
            else state.selectedBehaviorId = id;
            renderApp();
        }

        window.toggleStudent = function(id) {
            if (state.selectedStudents.has(id)) state.selectedStudents.delete(id);
            else state.selectedStudents.add(id);
            renderApp();
        }

        window.toggleCustomGroupSelection = function(members) {
            let allSelected = true;
            members.forEach(id => {
                if(!state.selectedStudents.has(id)) allSelected = false;
            });
            members.forEach(id => {
                if(allSelected) state.selectedStudents.delete(id);
                else state.selectedStudents.add(id);
            });
            renderApp();
        }

        window.clearSelection = function() {
            state.selectedStudents.clear();
            state.selectedBehaviorId = null;
            state.actionCount = 1;
            renderApp();
        }

        function updateActionBar() {
            const bar = document.getElementById('action-bar');
            if (state.selectedStudents.size > 0 && state.selectedBehaviorId) {
                const behavior = state.behaviors.find(b => b.id === state.selectedBehaviorId);
                if (!behavior) return;

                document.getElementById('action-subject').innerText = `科目：${state.settings.currentSubject}`;
                document.getElementById('action-desc').innerHTML = `給 <span class="text-blue-400 font-bold">${state.selectedStudents.size}</span> 人記 「${behavior.name}」`;
                document.getElementById('action-count').innerText = state.actionCount;
                
                bar.classList.remove('action-bar-hidden');
                bar.classList.add('action-bar-visible');
            } else {
                bar.classList.remove('action-bar-visible');
                bar.classList.add('action-bar-hidden');
            }
        }

        document.getElementById('btn-inc-count').onclick = () => {
            if(state.actionCount < 10) state.actionCount++;
            updateActionBar();
        };
        document.getElementById('btn-dec-count').onclick = () => {
            if(state.actionCount > 1) state.actionCount--;
            updateActionBar();
        };
        document.getElementById('btn-clear-selection').onclick = window.clearSelection;
        
        document.getElementById('btn-submit-record').onclick = async () => {
            if (!currentUser || !state.selectedBehaviorId || state.selectedStudents.size === 0) return;
            
            const btn = document.getElementById('btn-submit-record');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 處理中...`;
            btn.disabled = true;

            const behavior = state.behaviors.find(b => b.id === state.selectedBehaviorId);
            const studentsArray = Array.from(state.selectedStudents).sort((a,b)=>a-b);
            
            const recordData = {
                timestamp: new Date().toISOString(),
                subject: state.settings.currentSubject,
                studentIds: studentsArray,
                behaviorId: behavior.id,
                behaviorName: behavior.name,
                points: behavior.points,
                count: state.actionCount,
                totalChange: behavior.points * state.actionCount
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'records'), recordData);
                showToast(`已成功紀錄 ${studentsArray.length} 位學生的表現`, 'success');
                window.clearSelection();
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("新增紀錄失敗", "error");
            } finally {
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> 確認送出`;
                btn.disabled = false;
            }
        };

        function createManageView() {
            const container = document.createElement('div');
            container.className = 'fade-in flex flex-col gap-6';

            const formSection = document.createElement('div');
            formSection.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-200';
            formSection.innerHTML = `
                <h2 class="text-base font-bold text-gray-800 mb-4">新增表現項目</h2>
                <div class="space-y-3">
                    <div>
                        <input type="text" id="new-item-name" placeholder="項目名稱 (例如: 遲到)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div class="flex gap-3">
                        <select id="new-item-type" class="w-1/3 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white text-sm">
                            <option value="positive">加分</option>
                            <option value="negative">扣分</option>
                        </select>
                        <input type="number" id="new-item-points" placeholder="分數 (如: 1)" min="1" value="1" class="w-1/3 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                        <button id="btn-add-behavior" class="w-1/3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 shadow-sm active:scale-95 transition-transform text-sm">新增</button>
                    </div>
                </div>
            `;
            container.appendChild(formSection);

            const listSection = document.createElement('div');
            listSection.innerHTML = `<h2 class="text-sm font-bold text-gray-500 mb-3 ml-1">現有項目管理</h2>`;
            const listDiv = document.createElement('div');
            listDiv.className = 'space-y-2';

            state.behaviors.forEach(b => {
                const isPositive = b.type === 'positive';
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100';
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${isPositive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${isPositive ? '+' : ''}${b.points}
                        </div>
                        <span class="font-medium text-gray-800">${b.name}</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="btn-edit-behavior text-gray-400 hover:text-blue-500 p-2 transition-colors" data-id="${b.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-del-behavior text-gray-400 hover:text-red-500 p-2 transition-colors" data-id="${b.id}">

                            <option value="week" ${state.statFilters.dateType === 'week' ? 'selected':''}>本週 (週一至週日)</option>
                            <option value="month" ${state.statFilters.dateType === 'month' ? 'selected':''}>本月</option>
                            <option value="all" ${state.statFilters.dateType === 'all' ? 'selected':''}>所有時間</option>
                            <option value="custom" ${state.statFilters.dateType === 'custom' ? 'selected':''}>自訂區間</option>

                </div>
            `;
            container.appendChild(filterSection);

            // Calculate filtered records
            let filteredRecords = state.records;
            if(state.statFilters.subject !== 'all') {
                filteredRecords = filteredRecords.filter(r => r.subject === state.statFilters.subject);
            }
            if(state.statFilters.dateType !== 'all') {
                const startObj = new Date(state.statFilters.startDate);
                startObj.setHours(0,0,0,0);
                const endObj = new Date(state.statFilters.endDate);
                endObj.setHours(23,59,59,999);
                filteredRecords = filteredRecords.filter(r => {
                    const d = new Date(r.timestamp);
                    return d >= startObj && d <= endObj;
                });
            }
            state.currentFilteredRecords = filteredRecords; // Store for CSV

            const totals = {};
            for(let i=1; i<=state.settings.studentsCount; i++) totals[i] = 0;
            filteredRecords.forEach(r => {
                r.studentIds.forEach(sid => {
                    if (totals[sid] !== undefined) totals[sid] += r.totalChange;
                });
            });

            // Summary Section
            const summarySection = document.createElement('div');
            summarySection.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';
            summarySection.innerHTML = `
                <div class="max-h-64 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th scope="col" class="px-4 py-3">座號</th>
                                <th scope="col" class="px-4 py-3 text-right">結算總分</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(totals).map(([id, score]) => `
                                <tr class="bg-white border-b last:border-0 hover:bg-gray-50">
                                    <td class="px-4 py-2.5 font-medium text-gray-900">${id} 號</td>
                                    <td class="px-4 py-2.5 text-right font-bold text-base ${score > 0 ? 'text-green-600' : score < 0 ? 'text-red-600' : 'text-gray-400'}">${score > 0 ? '+' : ''}${score}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(summarySection);

            // History Section (Filtered)
            const historySection = document.createElement('div');
            historySection.innerHTML = `<h2 class="text-sm font-bold text-gray-500 mb-3 ml-1">詳細紀錄明細 (${filteredRecords.length} 筆)</h2>`;
            const historyList = document.createElement('div');
            historyList.className = 'space-y-3';

            if (filteredRecords.length === 0) {
                historyList.innerHTML = `<div class="text-center text-gray-400 py-6 bg-white rounded-xl border border-dashed border-gray-200">此區間內無紀錄</div>`;
            } else {
                const recentRecords = filteredRecords.slice(0, 50); 
                recentRecords.forEach(r => {
                    const date = new Date(r.timestamp);
                    const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                    const isPositive = r.totalChange > 0;
                    
                    const item = document.createElement('div');
                    item.className = 'bg-white p-3 rounded-lg shadow-sm border border-gray-100 relative overflow-hidden';
                    item.innerHTML = `
                        <div class="absolute top-0 left-0 w-1 h-full ${isPositive ? 'bg-green-500' : 'bg-red-500'}"></div>
                        <div class="flex justify-between items-start ml-2">
                            <div>
                                <div class="text-xs text-gray-400 mb-1">${timeStr} <span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded ml-1">${r.subject || '無'}</span></div>
                                <div class="font-medium text-gray-800 text-sm mb-1">${r.behaviorName} (x${r.count})</div>
                                <div class="text-xs text-gray-600 font-mono">對象: ${r.studentIds.join(', ')} 號</div>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="font-bold text-lg ${isPositive ? 'text-green-600' : 'text-red-600'}">${isPositive ? '+' : ''}${r.totalChange}</span>
                                <button class="btn-del-record text-gray-300 hover:text-red-500 text-sm p-1 transition-colors" data-id="${r.id}"><i class="fas fa-times-circle"></i></button>
                            </div>
                        </div>
                    `;
                    historyList.appendChild(item);
                });
                if(filteredRecords.length > 50) {
                     historyList.innerHTML += `<div class="text-center text-xs text-gray-400 mt-2">僅顯示最新 50 筆，完整紀錄請匯出 CSV</div>`;
                }
            }
            historySection.appendChild(historyList);
            container.appendChild(historySection);

            // Filter Event Listeners Setup
            setTimeout(() => {
                document.getElementById('stat-subject').onchange = (e) => {
                    state.statFilters.subject = e.target.value; renderApp();
                };
                document.getElementById('stat-quick-date').onchange = (e) => {
                    const val = e.target.value;
                    state.statFilters.dateType = val;
                    const now = new Date();
                    if (val === 'today') {
                        state.statFilters.startDate = getLocalDateString(now);
                        state.statFilters.endDate = getLocalDateString(now);
                    } else if (val === 'week') {
                        const day = now.getDay(); const diff = now.getDate() - day + (day == 0 ? -6:1);
                        const monday = new Date(now.setDate(diff));
                        state.statFilters.startDate = getLocalDateString(monday);
                        state.statFilters.endDate = getLocalDateString(new Date());
                    } else if (val === 'month') {
                        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                        state.statFilters.startDate = getLocalDateString(firstDay);
                        state.statFilters.endDate = getLocalDateString(new Date());
                    }
                    renderApp();
                };
                const updateCustomDate = () => {
                    state.statFilters.startDate = document.getElementById('stat-start').value;
                    state.statFilters.endDate = document.getElementById('stat-end').value;
                    renderApp();
                };
                document.getElementById('stat-start').onchange = updateCustomDate;
                document.getElementById('stat-end').onchange = updateCustomDate;

                document.getElementById('btn-export-csv').onclick = window.exportCSV;
                document.querySelectorAll('.btn-del-record').forEach(btn => {
                    btn.onclick = (e) => window.confirmDeleteRecord(e.currentTarget.getAttribute('data-id'));
                });
            }, 0);

            return container;
        }

        window.exportCSV = function() {
            const recordsToExport = state.currentFilteredRecords;
            if(!recordsToExport || recordsToExport.length === 0) {
                return showToast('目前篩選條件下沒有紀錄', 'error');
            }
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "日期,時間,科目/常規,座號,表現項目,單次分數,次數,總變動分數\n";

            recordsToExport.forEach(r => {
                const date = new Date(r.timestamp);
                const dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;
                const timeStr = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                const subject = r.subject || '無';
                
                r.studentIds.forEach(sid => {
                    const row = [dateStr, timeStr, subject, sid, r.behaviorName, r.points, r.count, r.totalChange].join(",");
                    csvContent += row + "\n";
                });
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `班級紀錄匯出_${getLocalDateString(new Date())}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('CSV 匯出成功', 'success');
        }

                        }
                    };
                });
            }, 0);

            return container;
        }

        window.editGroupModal = function(idx) {
            const group = state.settings.groups[idx];
            let tempMembers = new Set(group.members);
            
            let gridHtml = '';
            for(let i=1; i<=state.settings.studentsCount; i++) {
                 const isSelected = tempMembers.has(i);
                 gridHtml += `<button data-id="${i}" class="group-member-btn aspect-square rounded-xl font-bold text-lg transition-colors ${isSelected ? 'bg-blue-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">${i}</button>`;
            }
            
            showModal(`
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-auto shadow-2xl h-[85vh] flex flex-col">
                    <h3 class="text-lg font-bold text-gray-800 mb-3">編輯小組</h3>
                    <div class="mb-4">
                         <label class="block text-xs text-gray-500 mb-1">小組顯示名稱</label>
                         <input type="text" id="edit-group-name" value="${group.name}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="例如: 蘋果組、第一組">
                    </div>
                    <div class="text-xs text-gray-500 mb-2 font-medium">點選以加入/移除成員：</div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar mb-4 bg-gray-50 p-2 rounded-xl border border-gray-100">
                        <div class="grid grid-cols-5 gap-2" id="group-member-grid">
                            ${gridHtml}
                        </div>
                    </div>
                    <div class="flex gap-3 mt-auto pt-2">
                        <button id="modal-cancel-group" class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold">取消</button>
                        <button id="modal-confirm-group" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-[0_4px_14px_0_rgba(37,99,235,0.39)]">儲存名單</button>
                    </div>
                </div>
            `);
            
            document.querySelectorAll('.group-member-btn').forEach(btn => {
                btn.onclick = (e) => {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    if(tempMembers.has(id)) {
                        tempMembers.delete(id);
                        e.currentTarget.classList.replace('bg-blue-500', 'bg-gray-100');
                        e.currentTarget.classList.replace('text-white', 'text-gray-600');
                        e.currentTarget.classList.remove('shadow-md');
                    } else {
                        tempMembers.add(id);
                        e.currentTarget.classList.replace('bg-gray-100', 'bg-blue-500');
                        e.currentTarget.classList.replace('text-gray-600', 'text-white');
                        e.currentTarget.classList.add('shadow-md');
                    }
                };
            });

            document.getElementById('modal-cancel-group').onclick = closeModal;
            document.getElementById('modal-confirm-group').onclick = async () => {
                const newName = document.getElementById('edit-group-name').value.trim();
                if(!newName) return showToast('名稱不可為空', 'error');
                
                group.name = newName;
                group.members = Array.from(tempMembers).sort((a,b)=>a-b);
                
                closeModal();
                if(currentUser) {
                    const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'config', 'settings');
                    await updateDoc(ref, { groups: state.settings.groups });
                    showToast('小組更新成功', 'success');
                }
            };
        }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-gray-800' : type === 'error' ? 'bg-red-600' : 'bg-gray-800';
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-green-400"></i>' : type === 'error' ? '<i class="fas fa-exclamation-circle text-white"></i>' : '';
            toast.className = `toast-enter ${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium w-full`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.showModal = function(htmlContent) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.children[0].classList.add('scale-100', 'opacity-100');
                modal.children[0].classList.remove('scale-95', 'opacity-0', 'transition-all');
            }, 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById('modal-container');
            if(modal.children.length > 0) {
                modal.children[0].classList.remove('scale-100', 'opacity-100');
                modal.children[0].classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 200);
            } else {
                modal.classList.add('hidden');
            }
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = e.currentTarget.getAttribute('data-tab');
                if(state.currentTab === tab) return;
                state.currentTab = tab;
                
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('text-blue-600');
                    b.classList.add('text-gray-400');
                });
                e.currentTarget.classList.remove('text-gray-400');
                e.currentTarget.classList.add('text-blue-600');
                
                if (tab !== 'record') {
                    state.selectedStudents.clear();
                    state.selectedBehaviorId = null;
                    state.actionCount = 1;
                }
                
                if(state.isLoaded) renderApp();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            
            // --- PWA 動態設定 (Manifest & Service Worker) ---
            const manifest = {
                "name": "班級經營小幫手",
                "short_name": "班小幫手",
                "display": "standalone",
                "background_color": "#f3f4f6",
                "theme_color": "#2563eb",
                "icons": [{
                    "src": "https://cdn-icons-png.flaticon.com/512/1080/1080985.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(manifestBlob);
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestUrl}">`);

            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => { }); 
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl).catch(console.error);
            }
        });
    </script>
</body>
</html>
